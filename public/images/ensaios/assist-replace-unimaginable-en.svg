<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1400" font-family="Inter, system-ui, -apple-system, sans-serif">
  <style>
    .header-title { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
    .header-sub { font-size: 13px; font-weight: 600; fill: #6a6a6a; letter-spacing: 0.8px; }
    .cell-title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    .cell-body { font-size: 14px; font-weight: 400; fill: #3a3a3a; }
    .row-label { font-size: 14px; font-weight: 700; fill: #1a1a1a; text-transform: uppercase; letter-spacing: 0.8px; }
    .caption { font-size: 12px; font-weight: 400; fill: #8a8a8a; font-style: italic; }
  </style>

  <rect width="800" height="1400" fill="#ffffff"/>

  <text x="20" y="55" class="row-label">Type</text>

  <rect x="170" y="20" width="200" height="70" fill="#E8EEF4" rx="6"/>
  <text x="270" y="48" class="header-sub" text-anchor="middle">TYPE 1</text>
  <text x="270" y="73" class="header-title" text-anchor="middle">Assist (Copilot)</text>

  <rect x="380" y="20" width="200" height="70" fill="#E8EFE9" rx="6"/>
  <text x="480" y="48" class="header-sub" text-anchor="middle">TYPE 2</text>
  <text x="480" y="73" class="header-title" text-anchor="middle">Replace</text>

  <rect x="590" y="20" width="200" height="70" fill="#F4EFE6" rx="6"/>
  <text x="690" y="48" class="header-sub" text-anchor="middle">TYPE 3</text>
  <text x="690" y="73" class="header-title" text-anchor="middle">Unimaginable</text>

  <text x="20" y="145" class="row-label">Unit of</text>
  <text x="20" y="163" class="row-label">change</text>

  <rect x="170" y="115" width="200" height="170" fill="#F5F8FB" rx="6"/>
  <text x="185" y="145" class="cell-body">Elevates human</text>
  <text x="185" y="164" class="cell-body">work in existing</text>
  <text x="185" y="183" class="cell-body">processes</text>

  <rect x="380" y="115" width="200" height="170" fill="#F5F9F5" rx="6"/>
  <text x="395" y="145" class="cell-body">Replaces human</text>
  <text x="395" y="164" class="cell-body">work in complete</text>
  <text x="395" y="183" class="cell-body">tasks of existing</text>
  <text x="395" y="202" class="cell-body">processes</text>

  <rect x="590" y="115" width="200" height="170" fill="#FAF7F1" rx="6"/>
  <text x="605" y="145" class="cell-body">Reviews processes</text>
  <text x="605" y="164" class="cell-body">end-to-end from</text>
  <text x="605" y="183" class="cell-body">the "pain" and</text>
  <text x="605" y="202" class="cell-body">creates a new product</text>

  <text x="20" y="345" class="row-label">Addressable</text>
  <text x="20" y="363" class="row-label">market</text>

  <rect x="170" y="315" width="200" height="130" fill="#F5F8FB" rx="6"/>
  <text x="185" y="345" class="cell-title">Medium</text>

  <rect x="380" y="315" width="200" height="130" fill="#F5F9F5" rx="6"/>
  <text x="395" y="345" class="cell-title">High</text>
  <text x="395" y="370" class="cell-body">Salaries and benefits</text>
  <text x="395" y="389" class="cell-body">already paid to</text>
  <text x="395" y="408" class="cell-body">perform these</text>
  <text x="395" y="427" class="cell-body">functions</text>

  <rect x="590" y="315" width="200" height="130" fill="#FAF7F1" rx="6"/>
  <text x="605" y="345" class="cell-title">Theoretically high</text>
  <text x="605" y="370" class="cell-body">Not calculated, but</text>
  <text x="605" y="389" class="cell-body">potential to absorb</text>
  <text x="605" y="408" class="cell-body">existing markets and</text>
  <text x="605" y="427" class="cell-body">create new ones</text>

  <text x="20" y="505" class="row-label">Risk</text>
  <text x="20" y="523" class="row-label">level</text>

  <rect x="170" y="475" width="200" height="170" fill="#F5F8FB" rx="6"/>
  <text x="185" y="505" class="cell-title">High</text>
  <text x="185" y="530" class="cell-body">Challenge is</text>
  <text x="185" y="549" class="cell-body">measuring the real</text>
  <text x="185" y="568" class="cell-body">incremental</text>
  <text x="185" y="587" class="cell-body">productivity gain</text>
  <text x="185" y="606" class="cell-body">attributable to the</text>
  <text x="185" y="625" class="cell-body">tool</text>

  <rect x="380" y="475" width="200" height="170" fill="#F5F9F5" rx="6"/>
  <text x="395" y="505" class="cell-title">Low / Medium</text>
  <text x="395" y="530" class="cell-body">Demand already</text>
  <text x="395" y="549" class="cell-body">proven, companies</text>
  <text x="395" y="568" class="cell-body">already pay to have</text>
  <text x="395" y="587" class="cell-body">functions performed</text>

  <rect x="590" y="475" width="200" height="170" fill="#FAF7F1" rx="6"/>
  <text x="605" y="505" class="cell-title">High</text>
  <text x="605" y="530" class="cell-body">Challenge of proving</text>
  <text x="605" y="549" class="cell-body">value for needs not</text>
  <text x="605" y="568" class="cell-body">yet addressed</text>

  <text x="20" y="705" class="row-label">How to</text>
  <text x="20" y="723" class="row-label">succeed</text>

  <rect x="170" y="675" width="200" height="210" fill="#F5F8FB" rx="6"/>
  <text x="185" y="705" class="cell-body">Measure real impact</text>
  <text x="185" y="724" class="cell-body">on outcomes and</text>
  <text x="185" y="743" class="cell-body">ensure usability for</text>
  <text x="185" y="762" class="cell-body">fast adoption of the</text>
  <text x="185" y="781" class="cell-body">tool</text>

  <rect x="380" y="675" width="200" height="210" fill="#F5F9F5" rx="6"/>
  <text x="395" y="705" class="cell-body">Accuracy and</text>
  <text x="395" y="724" class="cell-body">reliability of the</text>
  <text x="395" y="743" class="cell-body">tool. Prove in</text>
  <text x="395" y="762" class="cell-body">testing that the</text>
  <text x="395" y="781" class="cell-body">solution truly</text>
  <text x="395" y="800" class="cell-body">replaces tasks and</text>
  <text x="395" y="819" class="cell-body">reduces internal or</text>
  <text x="395" y="838" class="cell-body">third-party</text>
  <text x="395" y="857" class="cell-body">headcount</text>

  <rect x="590" y="675" width="200" height="210" fill="#FAF7F1" rx="6"/>
  <text x="605" y="705" class="cell-body">Identify strong pain</text>
  <text x="605" y="724" class="cell-body">and ask: how would</text>
  <text x="605" y="743" class="cell-body">we solve this if</text>
  <text x="605" y="762" class="cell-body">there were no limit</text>
  <text x="605" y="781" class="cell-body">to work and energy</text>
  <text x="605" y="800" class="cell-body">spent on the task?</text>

  <text x="20" y="945" class="row-label">Examples</text>

  <rect x="170" y="915" width="200" height="380" fill="#F5F8FB" rx="6"/>
  <text x="185" y="945" class="cell-title">Cursor</text>
  <text x="185" y="965" class="cell-body">(autocomplete mode)</text>

  <text x="185" y="1000" class="cell-title">GitHub Copilot</text>
  <text x="185" y="1020" class="cell-body">Mainstream code copilot</text>

  <text x="185" y="1055" class="cell-title">Cognifyze (BR)</text>
  <text x="185" y="1075" class="cell-body">Wearable capturing</text>
  <text x="185" y="1094" class="cell-body">in-store sales</text>
  <text x="185" y="1113" class="cell-body">interactions, returning</text>
  <text x="185" y="1132" class="cell-body">coaching to the team</text>

  <rect x="380" y="915" width="200" height="380" fill="#F5F9F5" rx="6"/>
  <text x="395" y="945" class="cell-title">Decagon, Sierra</text>
  <text x="395" y="965" class="cell-body">SAC agents solving</text>
  <text x="395" y="984" class="cell-body">70%+ of tickets</text>

  <text x="395" y="1020" class="cell-title">Pencil, Omneky</text>
  <text x="395" y="1040" class="cell-body">Marketing creatives</text>
  <text x="395" y="1059" class="cell-body">at scale</text>

  <text x="395" y="1095" class="cell-title">Finic, Variance (YC)</text>
  <text x="395" y="1115" class="cell-body">Automated fraud</text>
  <text x="395" y="1134" class="cell-body">investigation</text>

  <text x="395" y="1170" class="cell-title">Claude Code, Lovable</text>
  <text x="395" y="1190" class="cell-body">Partial dev and design</text>

  <rect x="590" y="915" width="200" height="380" fill="#FAF7F1" rx="6"/>
  <text x="605" y="945" class="cell-title">BeeSafe AI</text>
  <text x="605" y="965" class="cell-body">Undercover agents</text>
  <text x="605" y="984" class="cell-body">engaging with</text>
  <text x="605" y="1003" class="cell-body">scammers to map</text>
  <text x="605" y="1022" class="cell-body">fraud infrastructure</text>

  <text x="605" y="1060" class="cell-title">Stripe Radar</text>
  <text x="605" y="1080" class="cell-body">100ms, 98% fraud</text>
  <text x="605" y="1099" class="cell-body">reduction</text>

  <text x="605" y="1135" class="cell-title">Conversational</text>
  <text x="605" y="1155" class="cell-title">commerce</text>
  <text x="605" y="1185" class="cell-body">E-commerce funnel</text>
  <text x="605" y="1204" class="cell-body">becomes natural dialog</text>

  <text x="20" y="1370" class="caption">Framework by Jake Heller (Y Combinator, 2025), adapted by Stéphanie Nakamura Ruas.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, system-ui, -apple-system, sans-serif">
  <style>
    .header-title { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
    .header-sub { font-size: 13px; font-weight: 600; fill: #6a6a6a; letter-spacing: 0.8px; }
    .cell-title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    .cell-body { font-size: 14px; font-weight: 400; fill: #3a3a3a; }
    .row-label { font-size: 14px; font-weight: 700; fill: #1a1a1a; text-transform: uppercase; letter-spacing: 0.8px; }
    .caption { font-size: 12px; font-weight: 400; fill: #8a8a8a; font-style: italic; }
  </style>

  <rect width="800" height="380" fill="#ffffff"/>

  <text x="20" y="55" class="row-label">Type</text>

  <rect x="170" y="20" width="200" height="70" fill="#E8EEF4" rx="6"/>
  <text x="270" y="48" class="header-sub" text-anchor="middle">TYPE 1</text>
  <text x="270" y="73" class="header-title" text-anchor="middle">Assist (Copilot)</text>

  <rect x="380" y="20" width="200" height="70" fill="#E8EFE9" rx="6"/>
  <text x="480" y="48" class="header-sub" text-anchor="middle">TYPE 2</text>
  <text x="480" y="73" class="header-title" text-anchor="middle">Replace</text>

  <rect x="590" y="20" width="200" height="70" fill="#F4EFE6" rx="6"/>
  <text x="690" y="48" class="header-sub" text-anchor="middle">TYPE 3</text>
  <text x="690" y="73" class="header-title" text-anchor="middle">Unimaginable</text>

  <text x="20" y="145" class="row-label">Definition</text>

  <rect x="170" y="115" width="200" height="110" fill="#F5F8FB" rx="6"/>
  <text x="185" y="145" class="cell-body">Helps professionals</text>
  <text x="185" y="164" class="cell-body">do better what they</text>
  <text x="185" y="183" class="cell-body">already do</text>

  <rect x="380" y="115" width="200" height="110" fill="#F5F9F5" rx="6"/>
  <text x="395" y="145" class="cell-body">Replaces tasks that</text>
  <text x="395" y="164" class="cell-body">previously required</text>
  <text x="395" y="183" class="cell-body">humans</text>

  <rect x="590" y="115" width="200" height="110" fill="#FAF7F1" rx="6"/>
  <text x="605" y="145" class="cell-body">Enables capabilities</text>
  <text x="605" y="164" class="cell-body">that were previously</text>
  <text x="605" y="183" class="cell-body">impossible</text>

  <text x="20" y="285" class="row-label">Heller's</text>
  <text x="20" y="303" class="row-label">example</text>

  <rect x="170" y="255" width="200" height="80" fill="#F5F8FB" rx="6"/>
  <text x="185" y="285" class="cell-body">CoCounsel for</text>
  <text x="185" y="304" class="cell-body">lawyers</text>

  <rect x="380" y="255" width="200" height="80" fill="#F5F9F5" rx="6"/>
  <text x="395" y="285" class="cell-body">Customer support,</text>
  <text x="395" y="304" class="cell-body">accounting</text>

  <rect x="590" y="255" width="200" height="80" fill="#FAF7F1" rx="6"/>
  <text x="605" y="285" class="cell-body">Analyzing millions</text>
  <text x="605" y="304" class="cell-body">of documents</text>
  <text x="605" y="323" class="cell-body">instantly</text>

  <text x="20" y="360" class="caption">Framework by Jake Heller (Y Combinator, 2025).</text>
</svg>
